<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena Sport 1 Premium - Live</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .player-wrap {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        video {
            width: 100%; height: 100%;
            display: block;
            background: #000;
        }

        .back-btn {
            position: fixed;
            top: 12px; left: 12px;
            z-index: 9999;
            background: rgba(200, 16, 46, 0.85);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            opacity: 0.35;
            transition: opacity 0.3s;
        }

        .back-btn:hover { opacity: 1; }
        .back-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .fs-btn {
            position: fixed;
            top: 12px; right: 12px;
            z-index: 9999;
            background: rgba(200, 16, 46, 0.85);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.35;
            transition: opacity 0.3s;
        }

        .fs-btn:hover { opacity: 1; }
        .fs-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .live-badge {
            position: fixed;
            top: 12px; left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(200, 16, 46, 0.9);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.4;
            transition: opacity 0.3s;
        }

        .live-badge:hover { opacity: 1; }

        .live-dot {
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 5;
            gap: 16px;
            transition: opacity 0.4s;
        }

        .loader.hidden { opacity: 0; pointer-events: none; }

        .spinner {
            width: 44px; height: 44px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #c8102e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text { color: #666; font-size: 0.85rem; }

        .error-msg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
            z-index: 10;
            display: none;
        }

        .error-msg h2 { font-size: 1.2rem; margin-bottom: 8px; }
        .error-msg p { color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Back
    </a>

    <div class="live-badge">
        <span class="live-dot"></span>
        Arena Sport 1 Premium
    </div>

    <button class="fs-btn" id="fsBtn">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        Fullscreen
    </button>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Connecting to Arena Sport 1 Premium...</div>
    </div>

    <div class="error-msg" id="errorMsg">
        <h2>Stream Unavailable</h2>
        <p>This channel may be geo-restricted or offline.</p>
    </div>

    <div class="player-wrap">
        <video id="video" controls autoplay muted playsinline></video>
    </div>

    <script>
        const video = document.getElementById('video');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('errorMsg');
        const fsBtn = document.getElementById('fsBtn');

        // Multiple stream sources to try
        const streams = [
            'http://78.130.250.2:8023/play/a02o/index.m3u8',
            'http://79.127.207.193:80/ArenaSport1HD/playlist.m3u8',
            'http://109.105.201.198/ARENASPORT1/video.m3u8?token=test'
        ];

        let currentStream = 0;

        function tryStream(index) {
            if (index >= streams.length) {
                loader.classList.add('hidden');
                errorMsg.style.display = 'block';
                return;
            }

            const url = streams[index];

            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    maxBufferLength: 10,
                    maxMaxBufferLength: 20,
                    startFragPrefetch: true
                });

                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    loader.classList.add('hidden');
                    video.play().catch(() => {});
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        hls.destroy();
                        tryStream(index + 1);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari native HLS
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    loader.classList.add('hidden');
                    video.play().catch(() => {});
                });
                video.addEventListener('error', () => {
                    tryStream(index + 1);
                });
            } else {
                loader.classList.add('hidden');
                errorMsg.style.display = 'block';
            }
        }

        // Start first stream
        tryStream(0);

        // Fallback timeout
        setTimeout(() => {
            if (!loader.classList.contains('hidden')) {
                loader.classList.add('hidden');
            }
        }, 15000);

        // Fullscreen
        fsBtn.addEventListener('click', () => {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen).call(el);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen).call(document);
            }
        });

        // F key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') fsBtn.click();
            if (e.key === ' ' || e.key === 'k') {
                e.preventDefault();
                video.paused ? video.play() : video.pause();
            }
            if (e.key === 'm') video.muted = !video.muted;
        });
    </script>
</body>
</html>
