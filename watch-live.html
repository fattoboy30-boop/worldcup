<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch Live - Arena Sport 1 Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .stream-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            transform-origin: 0 0;
        }

        .back-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 9999;
            background: rgba(200, 16, 46, 0.9);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            opacity: 0.4;
            transition: opacity 0.3s;
        }

        .back-btn:hover { opacity: 1; }
        .back-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .fullscreen-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 9999;
            background: rgba(200, 16, 46, 0.9);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.4;
            transition: opacity 0.3s;
        }

        .fullscreen-btn:hover { opacity: 1; }
        .fullscreen-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 5;
            gap: 16px;
            transition: opacity 0.4s;
        }

        .loading.hidden { opacity: 0; pointer-events: none; }

        .spinner {
            width: 44px; height: 44px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #c8102e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text { color: #666; font-size: 0.85rem; font-family: sans-serif; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Back
    </a>

    <button class="fullscreen-btn" id="fsBtn">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        Fullscreen
    </button>

    <div class="loading" id="loader">
        <div class="spinner"></div>
        <div class="loading-text">Loading Arena Sport 1 Premium...</div>
    </div>

    <iframe id="stream" class="stream-frame" src="about:blank"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen loading="eager"></iframe>

    <script>
        const iframe = document.getElementById('stream');
        const loader = document.getElementById('loader');
        const fsBtn = document.getElementById('fsBtn');

        // Channel URL
        const channelUrl = "https://tvgarden.world/tv/sports/Arena%20Sport%201%20Premium";

        // Zoom config: adjust these to frame the video player
        const ZOOM = 1.45;
        const OFFSET_X = -2;
        const OFFSET_Y = -85;

        function applyZoom() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            iframe.style.transform = `scale(${ZOOM}) translate(${OFFSET_X}px, ${OFFSET_Y}px)`;
            iframe.style.width = w + 'px';
            iframe.style.height = h + 'px';
        }

        // Load stream
        requestAnimationFrame(() => {
            iframe.src = channelUrl;
            applyZoom();
        });

        window.addEventListener('resize', applyZoom);

        iframe.addEventListener('load', () => {
            setTimeout(() => loader.classList.add('hidden'), 1500);
        });

        // Fallback hide loader
        setTimeout(() => loader.classList.add('hidden'), 10000);

        // Fullscreen
        fsBtn.addEventListener('click', () => {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen).call(el);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen).call(document);
            }
        });

        // F key for fullscreen
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') fsBtn.click();
        });
    </script>
</body>
</html>
