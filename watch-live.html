<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Sport 1 Premium - Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

        .wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        iframe {
            width: 100%; height: 100%;
            border: none;
        }

        .back {
            position: fixed;
            top: 12px; left: 12px;
            z-index: 99999;
            background: rgba(200, 16, 46, 0.9);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.5;
            transition: opacity 0.2s;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .back:hover { opacity: 1; }
        .back svg { width: 16px; height: 16px; fill: currentColor; }

        .loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 50000;
            gap: 16px;
            transition: opacity 0.4s;
        }
        .loader.hidden { opacity: 0; pointer-events: none; }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #c8102e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text { color: #555; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading Arena Sport 1 Premium...</div>
    </div>

    <a href="index.html" class="back">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Back
    </a>

    <div class="wrapper">
        <iframe id="stream" src="about:blank"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen></iframe>
    </div>

    <script>
        const iframe = document.getElementById('stream');
        const loader = document.getElementById('loader');

        // Load tvgarden full screen — user navigates to channel inside iframe
        iframe.src = "https://tvgarden.world/";

        iframe.addEventListener('load', () => {
            setTimeout(() => loader.classList.add('hidden'), 1500);
        });

        // Fallback
        setTimeout(() => loader.classList.add('hidden'), 8000);
    </script>
</body>
</html>
