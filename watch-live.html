<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Live - FIFA World Cup 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c8102e;
            --primary-dark: #a00d24;
            --dark: #0a0a0a;
            --text: #ffffff;
            --text-muted: #9a9ab0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .watch-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(10, 10, 16, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .watch-header .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            transition: background 0.2s;
        }

        .watch-header .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .watch-header .back-btn svg {
            width: 18px;
            height: 18px;
        }

        .watch-header .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .live-badge .live-dot {
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .watch-header .channel-name {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .stream-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: #000;
            position: relative;
        }

        .stream-wrapper {
            width: 100%;
            max-width: 1400px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }

        .stream-wrapper iframe {
            width: 100%;
            height: calc(100vh - 120px);
            min-height: 500px;
            border: none;
            display: block;
        }

        .stream-controls {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .stream-controls button {
            background: rgba(200, 16, 46, 0.9);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
            font-family: 'Roboto', sans-serif;
        }

        .stream-controls button:hover {
            background: var(--primary);
        }

        .stream-controls button svg {
            width: 18px;
            height: 18px;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 5;
            gap: 16px;
            transition: opacity 0.3s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Fullscreen styles */
        .stream-wrapper:fullscreen {
            max-width: none;
            border-radius: 0;
        }

        .stream-wrapper:fullscreen iframe {
            height: 100vh;
            min-height: auto;
        }

        .stream-wrapper:-webkit-full-screen {
            max-width: none;
            border-radius: 0;
        }

        .stream-wrapper:-webkit-full-screen iframe {
            height: 100vh;
            min-height: auto;
        }

        .stream-wrapper:-moz-full-screen {
            max-width: none;
            border-radius: 0;
        }

        .stream-wrapper:-moz-full-screen iframe {
            height: 100vh;
            min-height: auto;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .watch-header {
                padding: 10px 12px;
            }

            .watch-header .channel-name {
                display: none;
            }

            .stream-wrapper iframe {
                height: calc(100vh - 100px);
                min-height: 300px;
            }

            .stream-controls {
                bottom: 10px;
                right: 10px;
            }

            .stream-controls button {
                padding: 8px 12px;
                font-size: 0.8rem;
            }
        }

        /* Landscape mobile */
        @media (max-width: 1024px) and (orientation: landscape) {
            .watch-header {
                padding: 6px 12px;
            }

            .stream-wrapper iframe {
                height: calc(100vh - 70px);
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="watch-header">
        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Back
        </a>
        <div class="live-badge">
            <span class="live-dot"></span>
            Live
        </div>
        <span class="channel-name">Arena Sport 1 Premium</span>
    </div>

    <div class="stream-container">
        <div class="stream-wrapper" id="streamWrapper">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading Arena Sport 1 Premium...</div>
            </div>
            <iframe 
                id="liveStreamFrame" 
                src="about:blank" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
                allowfullscreen
                title="Arena Sport 1 Premium - Live Stream"
                loading="eager"
            ></iframe>
            <div class="stream-controls">
                <button id="fullscreenBtn" title="Toggle Fullscreen">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                    </svg>
                    Fullscreen
                </button>
            </div>
        </div>
    </div>

    <script>
        const streamUrl = "https://tvgarden.world/tv/sports/Arena%20Sport%201%20Premium";
        const iframe = document.getElementById('liveStreamFrame');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const streamWrapper = document.getElementById('streamWrapper');

        // Load stream immediately
        requestAnimationFrame(() => {
            iframe.src = streamUrl;
        });

        iframe.addEventListener('load', () => {
            loadingOverlay.classList.add('hidden');
        });

        // Fallback: hide loader after 8 seconds
        setTimeout(() => {
            loadingOverlay.classList.add('hidden');
        }, 8000);

        // Fullscreen toggle
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
                if (streamWrapper.requestFullscreen) {
                    streamWrapper.requestFullscreen();
                } else if (streamWrapper.webkitRequestFullscreen) {
                    streamWrapper.webkitRequestFullscreen();
                } else if (streamWrapper.mozRequestFullScreen) {
                    streamWrapper.mozRequestFullScreen();
                } else if (streamWrapper.msRequestFullscreen) {
                    streamWrapper.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });

        // Keyboard shortcut: F for fullscreen
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                fullscreenBtn.click();
            }
        });
    </script>
</body>
</html>
