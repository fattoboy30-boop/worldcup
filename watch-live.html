<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Sport 1 Premium - Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe { position: fixed; top: 0; left: 0; border: none; transform-origin: 0 0; }
        .back {
            position: fixed; top: 10px; left: 10px; z-index: 99999;
            background: rgba(0,0,0,0.6); color: #fff; border: none;
            padding: 6px 12px; border-radius: 6px; cursor: pointer;
            font-size: 14px; text-decoration: none; opacity: 0.4;
        }
        .back:hover { opacity: 1; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back</a>
    <iframe id="f" src="about:blank"></iframe>
    <script>
        const f = document.getElementById('f');
        const url = "https://tvgarden.world/tv/sports/Arena%20Sport%201%20Premium";

        function fit() {
            const W = window.innerWidth, H = window.innerHeight;
            // tvgarden: sidebar ~260px, top bar ~56px, video starts ~156px
            const sx = W / (W - 260);
            const sy = H / (H - 156);
            const s = Math.max(sx, sy) * 1.03;
            const tx = -((260 * s) - (s - 1) * W) / s;
            const ty = -((156 * s) - (s - 1) * H) / s;
            f.style.width = W + 'px';
            f.style.height = H + 'px';
            f.style.transform = `scale(${s}) translate(${tx}px, ${ty}px)`;
        }

        f.src = url;
        fit();
        window.onresize = fit;
    </script>
</body>
</html>
