<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arena Sport 1 Premium - Live</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        .player-wrap {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
        }

        video {
            width: 100%; height: 100%;
            display: block; background: #000;
        }

        .overlay-btns {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 99999;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px;
            pointer-events: none;
        }

        .overlay-btns > * { pointer-events: auto; }

        .btn {
            background: rgba(200, 16, 46, 0.85);
            color: #fff; border: none;
            padding: 8px 14px; border-radius: 6px;
            cursor: pointer; font-size: 0.85rem;
            display: flex; align-items: center; gap: 6px;
            text-decoration: none;
            opacity: 0.35; transition: opacity 0.3s;
        }
        .btn:hover { opacity: 1; }
        .btn svg { width: 16px; height: 16px; fill: currentColor; }

        .live-badge {
            background: rgba(200, 16, 46, 0.9);
            color: #fff; padding: 6px 14px;
            border-radius: 20px; font-size: 0.75rem;
            font-weight: 600; letter-spacing: 1px;
            display: flex; align-items: center; gap: 8px;
            opacity: 0.5;
        }

        .live-dot {
            width: 8px; height: 8px;
            background: #fff; border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        .loader {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; z-index: 50000;
            gap: 16px; transition: opacity 0.5s;
        }
        .loader.hidden { opacity: 0; pointer-events: none; }

        .spinner {
            width: 44px; height: 44px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #c8102e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text { color: #666; font-size: 0.85rem; }
        .loader-sub { color: #444; font-size: 0.75rem; margin-top: -8px; }

        .error-box {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; z-index: 10;
            display: none; color: #fff;
        }
        .error-box h2 { font-size: 1.1rem; margin-bottom: 6px; }
        .error-box p { color: #888; font-size: 0.85rem; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="overlay-btns">
        <a href="index.html" class="btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Back
        </a>
        <div class="live-badge"><span class="live-dot"></span> Arena Sport 1 Premium</div>
        <button class="btn" id="fsBtn">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            Fullscreen
        </button>
    </div>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Connecting to Arena Sport 1 Premium...</div>
        <div class="loader-sub" id="sourceLabel">Testing sources...</div>
    </div>

    <div class="error-box" id="errorBox">
        <h2>Stream Unavailable</h2>
        <p>All sources are currently offline or geo-restricted.</p>
        <a href="index.html" class="btn" style="margin:0 auto; opacity:1;">Back to Home</a>
    </div>

    <div class="player-wrap">
        <video id="video" controls autoplay muted playsinline></video>
    </div>

    <script>
        const video = document.getElementById('video');
        const loader = document.getElementById('loader');
        const errorBox = document.getElementById('errorBox');
        const sourceLabel = document.getElementById('sourceLabel');
        const fsBtn = document.getElementById('fsBtn');

        const streams = [
            { name: 'Source 1', url: 'http://109.105.201.198/ARENASPORT1/video.m3u8?token=test' },
            { name: 'Source 2', url: 'http://78.130.250.2:8023/play/a02o/index.m3u8' },
            { name: 'Source 3', url: 'http://79.127.207.193:80/ArenaSport1HD/playlist.m3u8' },
            { name: 'Source 4', url: 'http://149.202.85.84:8080/arenaSp1-2050/local/index.m3u8' }
        ];

        let currentIdx = 0;
        let hls = null;

        function tryStream(idx) {
            if (idx >= streams.length) {
                loader.classList.add('hidden');
                errorBox.style.display = 'block';
                return;
            }

            const s = streams[idx];
            sourceLabel.textContent = 'Trying ' + s.name + '...';

            if (hls) { hls.destroy(); hls = null; }

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    maxBufferLength: 10,
                    startFragPrefetch: true,
                    manifestLoadingTimeOut: 8000,
                    manifestLoadingMaxRetry: 2,
                    levelLoadingTimeOut: 8000
                });

                hls.loadSource(s.url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    loader.classList.add('hidden');
                    video.play().catch(() => {});
                });

                hls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) {
                        hls.destroy();
                        hls = null;
                        setTimeout(() => tryStream(idx + 1), 500);
                    }
                });

                // Timeout per source
                setTimeout(() => {
                    if (video.readyState < 2 && hls && !loader.classList.contains('hidden')) {
                        hls.destroy();
                        hls = null;
                        tryStream(idx + 1);
                    }
                }, 10000);

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = s.url;
                video.onloadedmetadata = () => {
                    loader.classList.add('hidden');
                    video.play().catch(() => {});
                };
                video.onerror = () => {
                    setTimeout(() => tryStream(idx + 1), 500);
                };
            } else {
                loader.classList.add('hidden');
                errorBox.style.display = 'block';
            }
        }

        tryStream(0);

        // Fullscreen
        fsBtn.addEventListener('click', () => {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen).call(el);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen).call(document);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') fsBtn.click();
            if (e.key === ' ' || e.key === 'k') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
            if (e.key === 'm') video.muted = !video.muted;
        });
    </script>
</body>
</html>
