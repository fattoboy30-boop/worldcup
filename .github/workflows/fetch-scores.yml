name: Fetch Live Scores & Standings

on:
  schedule:
    - cron: '*/2 * * * *'  # Every 2 minutes during tournament
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch scores, standings, and fixtures from football-data.org
        run: node fetch-stats.js
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fixtures.json scores.json standings.json
          git diff --staged --quiet || git commit -m "Update scores and standings [automated]"
          git push
